name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: Accept Android SDK licenses and ensure compileSdk 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi
          if [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Prepare release APK & build summary
        id: apk_meta
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          RELEASE_APK_PATH="build/app/outputs/flutter-apk/HydroChime-latest.apk"
          cp "$APK_PATH" "$RELEASE_APK_PATH"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          {
            echo "apk_size=$APK_SIZE"
            echo "apk_sha256=$APK_SHA256"
            echo "release_apk_path=$RELEASE_APK_PATH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## HydroChime Release APK"
            echo ""
            echo "- **Branch / Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **APK Path:** \`$APK_PATH\`"
            echo "- **APK Size:** \`$APK_SIZE\`"
            echo "- **SHA-256:** \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hydrochime-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Update rolling latest tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest

      - name: Publish rolling pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: HydroChime Latest
          prerelease: true
          overwrite_files: true
          append_body: false
          body: |
            Automated rolling pre-release built from `main`.

            - **Commit:** `${{ github.sha }}`
            - **APK:** `HydroChime-latest.apk` (`${{ steps.apk_meta.outputs.apk_size }}`)
            - **SHA-256:** `${{ steps.apk_meta.outputs.apk_sha256 }}`
          files: ${{ steps.apk_meta.outputs.release_apk_path }}

